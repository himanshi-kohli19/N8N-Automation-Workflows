<svg viewBox="0 0 1240 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dfdTitle dfdDesc">
  <title id="dfdTitle">Agent Verification System — Data Flow Diagram</title>
  <desc id="dfdDesc">Three-column layout: external partners on the left, pipeline in the center, failure branch on the right. Sources at the top, supporting components at the bottom.</desc>

  <style>
    .lane-label   { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: 0.08em; fill: #6b7280; text-transform: uppercase; }
    .lane-bg      { fill: #f5f5f4; stroke: #e5e7eb; stroke-width: 1; }
    .box          { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.2; rx: 6; ry: 6; }
    .title        { font: 600 12px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #18181b; }
    .subtitle     { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; }
    .conn         { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .flowlabel    { font: 500 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #374151; }
    .flowlabel-bg { fill: #ffffff; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1240" height="940" fill="#ffffff"/>

  <!-- TOP LANE: SOURCES -->
  <rect class="lane-bg" x="20" y="20" width="1200" height="80" rx="8"/>
  <text class="lane-label" x="32" y="40">Event Sources</text>

  <rect class="box" x="380" y="50" width="200" height="44"/>
  <text class="title"    x="480" y="70" text-anchor="middle">CRM</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">emits agent.activated</text>

  <rect class="box" x="660" y="50" width="200" height="44"/>
  <text class="title"    x="760" y="70" text-anchor="middle">24h Cron Job</text>
  <text class="subtitle" x="760" y="84" text-anchor="middle">emits test event</text>

  <!-- PARTNERS (LEFT) -->
  <rect class="box" x="100" y="380" width="200" height="44"/>
  <text class="title"    x="200" y="400" text-anchor="middle">CRM</text>
  <text class="subtitle" x="200" y="414" text-anchor="middle">read agent record</text>

  <rect class="box" x="80"  y="460" width="240" height="44"/>
  <text class="title"    x="200" y="480" text-anchor="middle">onereal.com Directory</text>
  <text class="subtitle" x="200" y="494" text-anchor="middle">Cloudflare-fronted</text>

  <rect class="box" x="80"  y="540" width="240" height="44"/>
  <text class="title"    x="200" y="560" text-anchor="middle">State DRE Sites (×50)</text>
  <text class="subtitle" x="200" y="574" text-anchor="middle">CA, TX, FL, NY...</text>

  <rect class="box" x="100" y="620" width="200" height="44"/>
  <text class="title"    x="200" y="640" text-anchor="middle">CRM</text>
  <text class="subtitle" x="200" y="654" text-anchor="middle">writeback verified</text>

  <!-- PIPELINE -->
  <rect class="box" x="480" y="130" width="240" height="44"/>
  <text class="title"    x="600" y="150" text-anchor="middle">n8n Webhook Receiver</text>
  <text class="subtitle" x="600" y="164" text-anchor="middle">HMAC verify · 202 ack</text>

  <rect class="box" x="480" y="210" width="240" height="44"/>
  <text class="title"    x="600" y="230" text-anchor="middle">Redis Queue</text>
  <text class="subtitle" x="600" y="244" text-anchor="middle">BullMQ · dedupe · locks</text>

  <rect class="box" x="480" y="290" width="240" height="44"/>
  <text class="title"    x="600" y="310" text-anchor="middle">n8n Orchestrator</text>
  <text class="subtitle" x="600" y="324" text-anchor="middle">dispatches jobs</text>

  <rect class="box" x="480" y="380" width="240" height="44"/>
  <text class="title"    x="600" y="400" text-anchor="middle">API Extract Worker</text>
  <text class="subtitle" x="600" y="414" text-anchor="middle">CRM API call</text>

  <rect class="box" x="480" y="460" width="240" height="44"/>
  <text class="title"    x="600" y="480" text-anchor="middle">JoinReal Verify Worker</text>
  <text class="subtitle" x="600" y="494" text-anchor="middle">Playwright</text>

  <rect class="box" x="480" y="540" width="240" height="44"/>
  <text class="title"    x="600" y="560" text-anchor="middle">DRE Verify Worker</text>
  <text class="subtitle" x="600" y="574" text-anchor="middle">Playwright</text>

  <rect class="box" x="480" y="620" width="240" height="44"/>
  <text class="title"    x="600" y="640" text-anchor="middle">Cross-Validate Worker</text>
  <text class="subtitle" x="600" y="654" text-anchor="middle">CRM exp == DRE exp?</text>

  <!-- FAILURE BRANCH -->
  <rect class="box" x="900" y="500" width="240" height="44"/>
  <text class="title"    x="1020" y="520" text-anchor="middle">Failure Router</text>
  <text class="subtitle" x="1020" y="534" text-anchor="middle">classify · log · alert</text>

  <rect class="box" x="900" y="580" width="240" height="44"/>
  <text class="title"    x="1020" y="600" text-anchor="middle">Jira</text>
  <text class="subtitle" x="1020" y="614" text-anchor="middle">review queue ticket</text>

  <rect class="box" x="900" y="640" width="240" height="44"/>
  <text class="title"    x="1020" y="660" text-anchor="middle">Alerts</text>
  <text class="subtitle" x="1020" y="674" text-anchor="middle">Slack · PagerDuty</text>

  <!-- BOTTOM LANE -->
  <rect class="lane-bg" x="20" y="730" width="1200" height="190" rx="8"/>
  <text class="lane-label" x="32" y="750">Supporting Components</text>

  <rect class="box" x="60"  y="765" width="240" height="60"/>
  <text class="title"    x="180" y="785" text-anchor="middle">Postgres</text>
  <text class="subtitle" x="180" y="801" text-anchor="middle">verification_runs</text>
  <text class="subtitle" x="180" y="815" text-anchor="middle">selector_registry · audit_log</text>

  <rect class="box" x="330" y="765" width="220" height="60"/>
  <text class="title"    x="440" y="785" text-anchor="middle">S3 (or MinIO)</text>
  <text class="subtitle" x="440" y="801" text-anchor="middle">screenshots · DOM</text>
  <text class="subtitle" x="440" y="815" text-anchor="middle">HAR · baselines</text>

  <rect class="box" x="580" y="765" width="240" height="60"/>
  <text class="title"    x="700" y="785" text-anchor="middle">Grafana / Prometheus</text>
  <text class="subtitle" x="700" y="801" text-anchor="middle">metrics · SLO dashboards</text>
  <text class="subtitle" x="700" y="815" text-anchor="middle">queue depth alerts</text>

  <rect class="box" x="850" y="765" width="220" height="60"/>
  <text class="title"    x="960" y="785" text-anchor="middle">NocoDB</text>
  <text class="subtitle" x="960" y="801" text-anchor="middle">table editor</text>
  <text class="subtitle" x="960" y="815" text-anchor="middle">Postgres RBAC · audit-trigger</text>

  <rect class="box" x="1100" y="765" width="120" height="60"/>
  <text class="title"    x="1160" y="785" text-anchor="middle">Ops Engineer</text>
  <text class="subtitle" x="1160" y="801" text-anchor="middle">reviews tickets</text>
  <text class="subtitle" x="1160" y="815" text-anchor="middle">updates registry</text>

  <!-- ARROWS -->

  <path class="conn" marker-end="url(#arr)" d="M 480 94 V 113 H 540 V 130"/>
  <rect class="flowlabel-bg" x="382" y="100" width="158" height="13"/>
  <text class="flowlabel" x="384" y="110">agent.activated event w/ ID</text>

  <path class="conn" marker-end="url(#arr)" d="M 760 94 V 113 H 660 V 130"/>
  <rect class="flowlabel-bg" x="675" y="100" width="80" height="13"/>
  <text class="flowlabel" x="677" y="110">test event</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 174 V 210"/>
  <rect class="flowlabel-bg" x="608" y="184" width="65" height="13"/>
  <text class="flowlabel" x="610" y="194">enqueue</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 254 V 290"/>
  <rect class="flowlabel-bg" x="608" y="264" width="60" height="13"/>
  <text class="flowlabel" x="610" y="274">dequeue</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 334 V 380"/>
  <rect class="flowlabel-bg" x="608" y="348" width="55" height="13"/>
  <text class="flowlabel" x="610" y="358">agent_id</text>

  <path class="conn" marker-end="url(#arr)" d="M 480 397 H 300"/>
  <path class="conn" marker-end="url(#arr)" d="M 300 410 H 480"/>
  <rect class="flowlabel-bg" x="350" y="383" width="55" height="13"/>
  <text class="flowlabel" x="352" y="393">request</text>
  <rect class="flowlabel-bg" x="350" y="415" width="60" height="13"/>
  <text class="flowlabel" x="352" y="425">metadata</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 424 V 460"/>
  <rect class="flowlabel-bg" x="608" y="434" width="100" height="13"/>
  <text class="flowlabel" x="610" y="444">name · state</text>

  <path class="conn" marker-end="url(#arr)" d="M 480 477 H 320"/>
  <path class="conn" marker-end="url(#arr)" d="M 320 490 H 480"/>
  <rect class="flowlabel-bg" x="370" y="463" width="55" height="13"/>
  <text class="flowlabel" x="372" y="473">scrape</text>
  <rect class="flowlabel-bg" x="370" y="495" width="55" height="13"/>
  <text class="flowlabel" x="372" y="505">profile</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 504 V 540"/>
  <rect class="flowlabel-bg" x="608" y="514" width="135" height="13"/>
  <text class="flowlabel" x="610" y="524">directory verified</text>

  <path class="conn" marker-end="url(#arr)" d="M 480 557 H 320"/>
  <path class="conn" marker-end="url(#arr)" d="M 320 570 H 480"/>
  <rect class="flowlabel-bg" x="370" y="543" width="55" height="13"/>
  <text class="flowlabel" x="372" y="553">scrape</text>
  <rect class="flowlabel-bg" x="370" y="575" width="80" height="13"/>
  <text class="flowlabel" x="372" y="585">expiration</text>

  <path class="conn" marker-end="url(#arr)" d="M 600 584 V 620"/>
  <rect class="flowlabel-bg" x="608" y="594" width="115" height="13"/>
  <text class="flowlabel" x="610" y="604">DRE expiration</text>

  <path class="conn" marker-end="url(#arr)" d="M 480 642 H 300"/>
  <rect class="flowlabel-bg" x="370" y="628" width="80" height="13"/>
  <text class="flowlabel" x="372" y="638">verified=true</text>

  <path class="conn" marker-end="url(#arr)" d="M 720 522 H 900"/>
  <rect class="flowlabel-bg" x="730" y="508" width="160" height="13"/>
  <text class="flowlabel" x="732" y="518">errors from any worker</text>

  <path class="conn" marker-end="url(#arr)" d="M 1020 544 V 580"/>
  <rect class="flowlabel-bg" x="1028" y="554" width="95" height="13"/>
  <text class="flowlabel" x="1030" y="564">create ticket</text>

  <path class="conn" marker-end="url(#arr)" d="M 1110 544 V 624 V 640"/>
  <rect class="flowlabel-bg" x="1118" y="600" width="50" height="13"/>
  <text class="flowlabel" x="1120" y="610">alert</text>

  <path class="conn" marker-end="url(#arr)" d="M 1160 765 V 624"/>
  <rect class="flowlabel-bg" x="1166" y="690" width="65" height="13"/>
  <text class="flowlabel" x="1168" y="700">review</text>

  <path class="conn" marker-end="url(#arr)" d="M 1100 795 H 1070"/>
  <rect class="flowlabel-bg" x="1075" y="780" width="35" height="13"/>
  <text class="flowlabel" x="1077" y="790">edits</text>
</svg>
